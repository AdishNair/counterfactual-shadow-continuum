[project]
name = "csc-prototype"
version = "0.1.0"
description = "Reproducible Counterfactual Shadow Continuum research runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
csc = "csc.cli:main"

[tool.setuptools.packages.find]
include = ["csc*"]
